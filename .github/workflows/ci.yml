name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tutionassist
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MIGRATION_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tutionassist
      TEST_DATABASE_URL: postgres://tutionassist_app:tutionassist_app@localhost:5432/tutionassist
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create app role
        run: psql "$MIGRATION_DATABASE_URL" -f infra/docker/initdb/01-roles.sql
      - run: pnpm build
      - run: pnpm typecheck
      - name: Migrate test database
        run: pnpm --filter @tutionassist/api db:migrate
      - run: pnpm test
